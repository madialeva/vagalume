schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  Vagalume es una prueba de concepto (nacida del producto Arume, de facturación y contabilidad) para ejecutar una misma aplicación .NET en dos modos: escritorio autónomo y servicio web alojado por una empresa.
  Tech stack: .NET 10, C#, xUnit, Npgsql, PostgreSQL embebido (binarios de Zonky para Linux x64 y Windows x64).
  Idioma: código, identificadores, comentarios, commits e issues en inglés; prosa de los artefactos OpenSpec en español.
  openspec/ es público: los artefactos deben ser autocontenidos.

